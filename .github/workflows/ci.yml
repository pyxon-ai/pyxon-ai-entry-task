name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install LibreOffice (legacy .doc support)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install dependencies (tested pins)
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Tests
        env:
          PYXON_EMBEDDER: hashing
        run: pytest
      - name: Held-out evaluation
        env:
          PYXON_EMBEDDER: hashing
        run: python -m benchmarks.heldout.run_heldout

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t pyxon-parser .
